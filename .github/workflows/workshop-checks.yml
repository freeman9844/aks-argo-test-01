name: Workshop checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run workshop regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
